[package]
build = "build.rs"
description = "Windows tray alarm clock"
edition = "2024"
name = "alarm-clock"
version = "1.0.0"

[[bin]]
name = "AlarmClock"
path = "src/main.rs"

[dependencies]
configparser = "3.3.0"
png = "0.18.1"
rodio = { version = "0.22.2", default-features = false, features = [
  "flac",
  "mp3",
  "mp4",
  "playback",
  "vorbis",
  "wav",
] }
tray-icon = { version = "0.26.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winrt-toast-reborn = "0.3.8"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
